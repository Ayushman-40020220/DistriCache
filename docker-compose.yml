services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL - Metadata, Route Registry, API Keys & Audit Telemetry
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: districache-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-districache}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - districache-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d districache"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis - Distributed Sliding-Window Rate Limiter & Fast Payload Caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: districache-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - districache-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Downstream Mock Service (FastAPI) - Artificial Latency & Fault Injection
  # ---------------------------------------------------------------------------
  mock-service:
    build:
      context: ./mock-service
      dockerfile: Dockerfile
    container_name: districache-mock-service
    restart: unless-stopped
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - districache-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 4. FastAPI Semantic Query Cache Engine (SentenceTransformers + FAISS)
  # ---------------------------------------------------------------------------
  semantic-cache:
    build:
      context: ./semantic-cache
      dockerfile: Dockerfile
    container_name: districache-semantic-cache
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379/0"
      DOWNSTREAM_LLM_URL: "http://mock-service:8001/v1/chat/completions"
      SIMILARITY_THRESHOLD: "0.95"
      CACHE_TTL_SECONDS: "86400"
      INDEX_STORAGE_PATH: "/data/faiss_index.bin"
      METADATA_STORAGE_PATH: "/data/faiss_metadata.json"
    ports:
      - "8000:8000"
    volumes:
      - faissdata:/data
    networks:
      - districache-net
    depends_on:
      redis:
        condition: service_healthy
      mock-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 5. DistriCache API Gateway & Rate Limiter (Node.js/Express)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: districache-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/districache
      REDIS_URL: redis://redis:6379
      CB_FAILURE_THRESHOLD: 5
      CB_RECOVERY_TIMEOUT_MS: 15000
      HEALTH_CHECK_INTERVAL_MS: 10000
      TELEMETRY_FLUSH_INTERVAL_MS: 1000
      TELEMETRY_BATCH_SIZE: 100
    ports:
      - "8080:8080"
    networks:
      - districache-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      semantic-cache:
        condition: service_healthy
      mock-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 6. Concurrency & Latency Stress-Testing Benchmark Runner
  # ---------------------------------------------------------------------------
  benchmark:
    build:
      context: ./benchmarks
      dockerfile: Dockerfile
    container_name: districache-benchmark
    environment:
      GATEWAY_URL: http://gateway:8080
      API_KEY_PRO: dc_live_testkey_123456789
      API_KEY_FREE: dc_free_demo_key
    networks:
      - districache-net
    depends_on:
      gateway:
        condition: service_healthy
    profiles:
      - benchmarks

networks:
  districache-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  faissdata:
